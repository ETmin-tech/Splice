[package]
name = "splice-fuzz"
version = "0.1.0"
edition = "2021"
publish = false

# Separate workspace on purpose: `cargo-fuzz` needs nightly `-Z sanitizer` flags
# and `libfuzzer-sys`, neither of which belongs in the shipped build graph. The
# root `Cargo.toml` excludes this directory for the same reason.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
splice-core = { path = "../crates/splice-core" }

# Every target parses untrusted bytes. A release-profile build keeps the corpus
# loop fast on byte-at-a-time mutations; debug builds of the SPAKE2 curve code
# are orders of magnitude slower for no extra coverage.
[profile.release]
debug = 1
codegen-units = 1
panic = "abort"

[[bin]]
name = "fuzz_frame"
path = "fuzz_targets/fuzz_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_code_parse"
path = "fuzz_targets/fuzz_code_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_ticket_parse"
path = "fuzz_targets/fuzz_ticket_parse.rs"
test = false
doc = false
bench = false