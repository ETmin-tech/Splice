name: ci

# Phase 1 quality gates (MasterPrompt-Fase1 §9 / Architecture §14).
#
# Every job runs the same commands a developer is told to run locally:
#   cargo fmt --all --check
#   cargo clippy --workspace --all-targets -- -D warnings
#   cargo test --workspace
# `deny` and `audit` get their own jobs because they consume the lockfile
# rather than the compiler, and because an advisory database outage must not
# masquerade as a broken build.
#
# The offline venue (tests/offline) and the discovery benchmark (tests/discovery)
# are Linux-only and need root plus `ip netns`; they live in offline.yml so this
# workflow stays a plain hosted-runner job.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # On macOS runners (Virtualization VM), the loopback interface has no default
      # multicast route (224.0.0.0/4), causing multicast datagram sends to fail with
      # ENETUNREACH / EADDRNOTAVAIL. Direct multicast traffic to lo0.
      - name: Configure multicast route (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo ifconfig lo0 multicast || true
          sudo route -nv add -net 224.0.0.0/4 -interface lo0 || sudo route -nv change -net 224.0.0.0/4 -interface lo0 || true

      # `pair_then_dev_ping_reaches_the_trusted_device` sets SPLICE_CONFIG_DIR,
      # which is process-global, but it is the only case in the binary that reads
      # the default config location; every other case passes an explicit temp dir
      # to `load_in`. So the default `cargo test` parallel schedule is safe here.
      - name: Test
        # Redirect to a file (portable across the three shells): the digest step
        # below turns a failure into annotations, which anyone can read, whereas
        # the raw job log needs admin rights. macOS is the one runner we cannot
        # reproduce locally, so its failures must be self-describing.
        run: cargo test --workspace --no-fail-fast > test-output.txt 2>&1
        env:
          RUST_BACKTRACE: "1"

      - name: Test failure digest
        if: failure()
        shell: bash
        run: |
          echo "=== failing tests ==="
          awk '/^---- .* stdout ----/{flag=1; count=0} flag{print; count++; if(count>60) flag=0}' test-output.txt | while IFS= read -r line; do
            echo "::error::$line"
          done
          # A host summary as an annotation too: the raw log is not public, and
          # macOS is the one platform we cannot reproduce locally.
          {
            echo "host: $(uname -srm 2>/dev/null || echo unknown)"
            echo "--- routes"
            netstat -nr 2>/dev/null | head -30 || true
            echo "--- interfaces"
            ifconfig 2>/dev/null | grep -E '^[a-z]|inet ' | head -40 || true
          } > host-summary.txt
          while IFS= read -r line; do
            echo "::notice::$line"
          done < host-summary.txt
          echo "=== last 150 lines of test output ==="
          tail -150 test-output.txt || true

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.os }}
          path: test-output.txt
          if-no-files-found: ignore

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit
        run: cargo audit

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Deny broken intra-doc links: the architecture references module docs by
      # path, so a renamed module must fail here rather than in a review.
      - name: rustdoc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings