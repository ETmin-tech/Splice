[workspace]
resolver = "2"
members = ["crates/splice-core", "crates/splice", "spikes/iroh-offline"]
# `fuzz/` is a separate workspace: cargo-fuzz needs the nightly `-Z sanitizer` flags and
# a `libfuzzer-sys` dependency that must not leak into the main build graph.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/splice"

[workspace.dependencies]
iroh = "1.4.1"
tokio = { version = "1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `default-features = false` drops postcard's `heapless-cas` default, which drags
# in `heapless 0.7.17` — the version with eight RustSec "unsound" advisories
# (RUSTSEC-2026-0574..0582). We always encode through `to_stdvec`/`take_from_bytes`
# with `use-std`, so the no_std `heapless` collection support is dead weight, and
# iroh-relay already builds postcard with `default-features = false` too.
postcard = { version = "1", features = ["use-std"], default-features = false }
blake3 = "1"
zeroize = { version = "1", features = ["derive"] }
rand = "0.9"
getrandom = "0.3"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "7"
mdns-sd = "0.22"
socket2 = { version = "0.6", features = ["all"] }
clap = { version = "4", features = ["derive"] }
data-encoding = "2"
if-addrs = "0.15"
subtle = "2"
spake2 = "0.4"

# SPAKE2's group arithmetic is elliptic-curve code: at `opt-level = 0` a single
# `finish()` takes long enough that the 10 000-guess invariant test never
# terminates. The test profile inherits `dev`, so these few dependencies are
# optimised while the workspace crates stay debuggable.
[profile.dev.package.spake2]
opt-level = 3

[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.hmac]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3
panic = "unwind" # so `Drop` guards (terminal restore) always run
