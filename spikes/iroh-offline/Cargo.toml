[package]
name = "iroh-offline"
version = "0.1.0"
edition = "2021"
publish = false
description = "Spike S1: measure iroh 1.4.1 behaviour on a LAN with no internet and no relay."

[dependencies]
iroh = "1.4.1"
iroh-mdns-address-lookup = "0.6.1"
n0-future = "0.3"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `default-features = false`: this spike never encodes with postcard, and the
# default `heapless-cas` feature would pull `heapless 0.7.17` (eight RustSec
# "unsound" advisories) into the whole workspace's lockfile. S1's measured
# results do not depend on it.
postcard = { version = "1", features = ["use-std"], default-features = false }
blake3 = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
opt-level = 2